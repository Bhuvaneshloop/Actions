name: sequential

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: print
        run: echo "hellow build"
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: print
        run: echo "test"
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: print
        run: echo "deploy"
